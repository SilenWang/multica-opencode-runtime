<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  补齐通用 lang=zh（不带地区）的 CJK 映射。

  fonts-noto-cjk 自带的 70-fonts-noto-cjk.conf 只对 zh-cn / zh-tw / zh-hk 做
  了 sans-serif / serif / monospace 的映射，查询里写 lang=zh 时命中不了任何一条
  规则，fontconfig 会退回到拉丁字体（Liberation Mono 之类），于是
  `fc-match 'sans-serif:lang=zh'` 看起来还是缺字体。

  这里把同样的映射补到通用 zh 上，优先级用 strong（与上游规则一致）。
  只影响带 lang=zh 的查询，纯拉丁查询（无 lang / lang=en）结果不变。
-->
<fontconfig>
    <match target="pattern">
        <test name="lang">
            <string>zh</string>
        </test>
        <test name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="lang">
            <string>zh</string>
        </test>
        <test name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Serif CJK SC</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="lang">
            <string>zh</string>
        </test>
        <test name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans Mono CJK SC</string>
        </edit>
    </match>
</fontconfig>
